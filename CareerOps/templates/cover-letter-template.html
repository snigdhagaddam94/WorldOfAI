<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} -- Cover Letter</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 11.5px;
    line-height: 1.6;
    color: #1a1a2e;
    background: #ffffff;
  }

  .page {
    width: 100%;
    max-width: {{PAGE_WIDTH}};
    margin: 0 auto;
    padding: 2px 0;
  }

  /* HEADER */
  .header { margin-bottom: 32px; }

  .header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #1a1a2e;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    line-height: 1.1;
  }

  .header-gradient {
    height: 2px;
    background: linear-gradient(to right, hsl(187, 74%, 32%), hsl(270, 70%, 45%));
    border-radius: 1px;
    margin-bottom: 10px;
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 10.5px;
    color: #555;
  }

  .contact-row a { color: #555; text-decoration: none; }
  .contact-row .separator { color: #bbb; }

  /* DATE + RECIPIENT */
  .meta { margin-bottom: 28px; }

  .date {
    font-size: 11px;
    color: #555;
    margin-bottom: 16px;
  }

  .recipient-name {
    font-size: 11.5px;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 2px;
  }

  .recipient-detail {
    font-size: 11px;
    color: #555;
    line-height: 1.6;
  }

  /* BODY */
  .salutation {
    font-size: 11.5px;
    color: #1a1a2e;
    margin-bottom: 18px;
  }

  .body p {
    font-size: 11.5px;
    line-height: 1.75;
    color: #2a2a2a;
    margin-bottom: 18px;
  }

  /* SIGNATURE */
  .closing { margin-top: 28px; }

  .closing-word {
    font-size: 11.5px;
    color: #2a2a2a;
    margin-bottom: 20px;
  }

  .sig-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 4px;
  }

  .sig-contact {
    font-size: 10.5px;
    color: #666;
    line-height: 1.6;
  }

  .sig-contact a { color: #666; text-decoration: none; }
  a { white-space: nowrap; }

  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page { padding: 0; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER — same design as CV -->
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="header-gradient"></div>
    <div class="contact-row">
      <span>{{PHONE}}</span>
      <span class="separator">|</span>
      <span>{{EMAIL}}</span>
      <span class="separator">|</span>
      <a href="{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a>
    </div>
  </div>

  <!-- DATE + RECIPIENT -->
  <div class="meta">
    <div class="date">{{DATE}}</div>
    <div class="recipient-name">{{RECIPIENT_NAME}}</div>
    <div class="recipient-detail">{{RECIPIENT_COMPANY}}<br>{{RECIPIENT_LOCATION}}</div>
  </div>

  <!-- SALUTATION -->
  <div class="salutation">{{SALUTATION}}</div>

  <!-- BODY — write each paragraph as <p>...</p> -->
  <div class="body">
    {{BODY}}
  </div>

  <!-- SIGNATURE -->
  <div class="closing">
    <div class="closing-word">{{CLOSING}}</div>
    <div class="sig-name">{{NAME}}</div>
    <div class="sig-contact">
      {{EMAIL}} &nbsp;&middot;&nbsp; {{PHONE}}<br>
      <a href="{{LINKEDIN_URL}}">{{LINKEDIN_DISPLAY}}</a>
    </div>
  </div>

</div>
</body>
</html>
